<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Семейные биографии"><title>Семейное древо</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.7}main{width:100%;max-width:720px;margin:0 auto;padding:18px 16px 44px}h1{margin:8px 0 20px;font-size:clamp(28px,7vw,38px);line-height:1.2;overflow-wrap:anywhere}.search{width:100%;padding:13px 14px;font-size:18px;border:1px solid #bbb;border-radius:8px;margin:6px 0 20px}.person{padding:8px 0;border-bottom:1px solid #e5e5e5}.person a,.back{color:#165db7;text-decoration:underline;text-underline-offset:2px}.back{display:inline-block;margin-bottom:20px;font-size:16px}.bio p{margin:0 0 1.15em}.bio img{max-width:100%;height:auto}</style></head><body><main id="app">Загрузка…</main><script>const PARTS=21;function b64bytes(s){const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}async function loadData(){const a=await Promise.all(Array.from({length:PARTS},(_,i)=>fetch('data/'+(i+1)+'.txt').then(r=>{if(!r.ok)throw Error('data');return r.text()})));return a.join('')}async function getPeople(){const s=await loadData(),ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();await w.write(b64bytes(s));await w.close();const out=await new Response(ds.readable).arrayBuffer();return JSON.parse(new TextDecoder().decode(out))}let PEOPLE=[];const root=document.getElementById('app');function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}function idFromUrl(){return decodeURIComponent(location.hash.slice(1))||new URLSearchParams(location.search).get('id')}function render(){const id=idFromUrl(),p=id&&PEOPLE.find(x=>x.id===id);if(p){document.title=p.name+' — Семейное древо';root.innerHTML='<a class="back" href="'+location.pathname+'">← К списку биографий</a><h1>'+esc(p.name)+'</h1><div class="bio">'+p.html+'</div>';return}document.title='Семейное древо';root.innerHTML='<h1>Биографии</h1><input id="q" class="search" placeholder="Поиск по имени..." autocomplete="off"><div id="list"></div>';const list=document.getElementById('list'),q=document.getElementById('q');function draw(){const t=q.value.trim().toLowerCase(),arr=t?PEOPLE.filter(x=>x.name.toLowerCase().includes(t)):PEOPLE;list.innerHTML=arr.map(x=>'<div class="person"><a href="'+location.pathname+'#'+encodeURIComponent(x.id)+'">'+esc(x.name)+'</a></div>').join('')}q.addEventListener('input',draw);draw()}getPeople().then(x=>{PEOPLE=x;render()}).catch(e=>{root.innerHTML='<h1>Ошибка загрузки</h1><p>Не удалось загрузить данные биографий.</p>'});window.addEventListener('hashchange',render);</script></body></html>
