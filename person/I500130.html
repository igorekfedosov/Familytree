<script>
(function(){
  const button=document.querySelector('.share-button');
  const isShareView=new URLSearchParams(window.location.search).get('share')==='1';

  if(button && !isShareView){
    const backLink=document.querySelector('a.back');
    if(backLink) backLink.insertAdjacentElement('afterend',button);
  }

  if(isShareView){
    document.body.classList.add('share-view');
    document.querySelectorAll('a[href]').forEach(function(anchor){
      let target;
      try{target=new URL(anchor.getAttribute('href'),window.location.href)}catch(e){return}
      const isPersonPage=/\/person\/I[^/]+\.html$/i.test(target.pathname);
      const isMainList=target.origin===window.location.origin &&
        (/\/Familytree\/?$/i.test(target.pathname) || /\/index\.html$/i.test(target.pathname));
      if(isPersonPage || isMainList){
        anchor.replaceWith.apply(anchor,Array.from(anchor.childNodes));
      }
    });
  }

  if(button){
    button.addEventListener('click',async function(){
      const shareUrl=new URL(window.location.href);
      shareUrl.searchParams.set('share','1');
      const title=document.title || document.querySelector('h1')?.textContent || 'Биография';
      const shareData={title:title,text:title,url:shareUrl.href};

      if(typeof navigator.share==='function'){
        try{
          await navigator.share(shareData);
          return;
        }catch(error){
          if(error && error.name==='AbortError') return;
        }
      }

      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(shareUrl.href);
          button.textContent='Ссылка скопирована';
          return;
        }
      }catch(error){}

      window.prompt('Скопируйте ссылку на биографию:',shareUrl.href);
    });
  }
})();
</script>

<div id="photo-lightbox" role="dialog" aria-modal="true" aria-label="Просмотр фотографии" aria-hidden="true" hidden>
  <button class="photo-lightbox-close" type="button" aria-label="Закрыть фотографию">&times;</button>
  <img alt="">
</div>
<script>
(function(){
  const modal=document.getElementById('photo-lightbox');
  if(!modal || modal.dataset.initialized==='true')return;
  modal.dataset.initialized='true';
  const image=modal.querySelector('img');
  const closeButton=modal.querySelector('.photo-lightbox-close');
  let lastTrigger=null;

  function closeLightbox(){
    if(!modal.classList.contains('is-open'))return;
    modal.classList.remove('is-open');
    modal.hidden=true;
    modal.setAttribute('aria-hidden','true');
    image.removeAttribute('src');
    document.body.classList.remove('photo-lightbox-open');
    if(lastTrigger && lastTrigger.isConnected){
      lastTrigger.focus({preventScroll:true});
    }
    lastTrigger=null;
  }

  function openLightbox(anchor,url){
    lastTrigger=anchor;
    const linkedImage=anchor.querySelector('img');
    image.alt=((linkedImage && linkedImage.getAttribute('alt')) ||
      anchor.getAttribute('aria-label') || anchor.textContent.trim() || 'Фотография').trim();
    image.src=url.href;
    modal.hidden=false;
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');
    document.body.classList.add('photo-lightbox-open');
    closeButton.focus({preventScroll:true});
  }

  document.addEventListener('click',function(event){
    if(event.defaultPrevented || event.button!==0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey)return;
    const target=event.target;
    const anchor=target && typeof target.closest==='function' ? target.closest('a[href]') : null;
    if(!anchor || anchor.hasAttribute('download'))return;
    let url;
    try{url=new URL(anchor.getAttribute('href'),document.baseURI)}catch(error){return}
    if(url.protocol!=='http:' && url.protocol!=='https:')return;
    const isImageFile=/\.(?:avif|bmp|gif|jpe?g|png|webp|tiff?)$/i.test(url.pathname);
    if(!isImageFile && !anchor.querySelector('img'))return;
    event.preventDefault();
    openLightbox(anchor,url);
  },true);

  closeButton.addEventListener('click',closeLightbox);
  modal.addEventListener('click',function(event){
    if(event.target===modal)closeLightbox();
  });
  document.addEventListener('keydown',function(event){
    if(!modal.classList.contains('is-open'))return;
    if(event.key==='Escape'){
      event.preventDefault();
      closeLightbox();
    }else if(event.key==='Tab'){
      event.preventDefault();
      closeButton.focus();
    }
  });
})();
</script>
