<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Биография: Марина Владимировна Пальгуева"><title>Марина Владимировна Пальгуева — Семейное древо</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#fcf0d7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.7}main{width:100%;max-width:720px;margin:0 auto;padding:18px 16px 44px}h1{margin:8px 0 0;font-size:clamp(28px,7vw,38px);line-height:1.2;overflow-wrap:anywhere}.search{width:100%;padding:13px 14px;font-size:18px;border:1px solid #bbb;border-radius:8px;margin:6px 0 20px}.person{padding:8px 0;border-bottom:1px solid #e5e5e5}.person a,.back{color:#165db7;text-decoration:underline;text-underline-offset:2px}.back{display:inline-block;margin-bottom:20px;font-size:16px}.life-years{margin:0;font-size:clamp(23px,5.8vw,27px);line-height:1.3}.bio{overflow-wrap:anywhere}.bio p{margin:0 0 1.15em}.bio a{color:#165db7;text-decoration:underline;text-underline-offset:2px}.bio a[href*="igorekfedosov.github.io/Familytree-Photos/"]{color:#d100a9}.bio strong,.bio b{font-weight:700}.bio u{text-decoration:underline}.bio em,.bio i{font-style:italic}</style><!-- PRIVATE_PERSON_GATE_START -->
<style>
html.private-person-locked body > *:not(#private-person-gate){visibility:hidden!important}
#private-person-gate{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:#fcf0d7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#private-person-gate .private-person-panel{width:100%;max-width:360px;padding:24px;border:1px solid #d2c4aa;border-radius:12px;background:#fffaf0;box-shadow:0 8px 32px rgba(0,0,0,.14)}
#private-person-gate h2{margin:0 0 8px;font-size:22px;line-height:1.3}
#private-person-gate p{margin:0 0 16px;font-size:16px}
#private-person-gate input{display:block;width:100%;padding:12px;border:1px solid #aaa;border-radius:7px;font:inherit;font-size:18px}
#private-person-gate button{margin-top:12px;padding:10px 16px;border:0;border-radius:7px;background:#165db7;color:#fff;font:inherit;cursor:pointer}
#private-person-gate .private-person-error{min-height:1.5em;margin:10px 0 0;color:#b42318;font-size:14px}
</style>
<script>
(function(){
  const accessKey='familytree-private-person-access';
  let allowed=false;
  try{allowed=sessionStorage.getItem(accessKey)==='ok'}catch(error){}
  if(allowed)return;

  document.documentElement.classList.add('private-person-locked');
  document.addEventListener('DOMContentLoaded',function(){
    const gate=document.createElement('div');
    gate.id='private-person-gate';
    gate.innerHTML='<div class="private-person-panel"><h2>Доступ к биографии</h2><p>Введите код, чтобы открыть эту биографию.</p><form><label for="private-person-code">Код доступа</label><input id="private-person-code" type="password" inputmode="numeric" autocomplete="off" aria-describedby="private-person-error" required><button type="submit">Открыть биографию</button><div class="private-person-error" id="private-person-error" role="alert"></div></form></div>';
    document.body.appendChild(gate);
    const form=gate.querySelector('form');
    const input=gate.querySelector('#private-person-code');
    const error=gate.querySelector('#private-person-error');
    input.focus();
    form.addEventListener('submit',function(event){
      event.preventDefault();
      if(input.value.trim()==='5158'){
        try{sessionStorage.setItem(accessKey,'ok')}catch(storageError){}
        document.documentElement.classList.remove('private-person-locked');
        gate.remove();
      }else{
        error.textContent='Неверный код. Попробуйте ещё раз.';
        input.value='';
        input.focus();
      }
    });
  });
})();
</script>
<!-- PRIVATE_PERSON_GATE_END --></head><body><main><a class="back" href="https://igorekfedosov.github.io/Familytree/">← К списку биографий</a><h1>Марина Владимировна Пальгуева</h1><div class="life-years"><strong>род. в 1977</strong></div><div class="ancestor-label" style="margin:0;line-height:1.1"><strong>троюродная сестра отца</strong></div><div class="ancestor-label" style="margin:2px 0 22px;line-height:1.1"><strong>Расчетное ДНК-родство: ~1,56%</strong></div></main><!-- SHARE_CONTROLS_START -->
<style>
.share-button{display:inline-block;margin:0 0 20px 12px;padding:7px 12px;border:1px solid #aaa;border-radius:7px;background:#fff;color:#222;font:inherit;font-size:15px;line-height:1.4;cursor:pointer}
.share-button:focus-visible{outline:2px solid #165db7;outline-offset:2px}
body.share-view .back,body.share-view .share-button{display:none!important}
</style>
<button type="button" class="share-button">Поделиться</button>
<script>
(function(){
  const button=document.querySelector('.share-button');
  const isShareView=new URLSearchParams(window.location.search).get('share')==='1';

  if(button && !isShareView){
    const backLink=document.querySelector('a.back');
    if(backLink) backLink.insertAdjacentElement('afterend',button);
  }

  if(isShareView){
    document.body.classList.add('share-view');
    document.querySelectorAll('a[href]').forEach(function(anchor){
      let target;
      try{target=new URL(anchor.getAttribute('href'),window.location.href)}catch(e){return}
      const isPersonPage=/\/person\/I[^/]+\.html$/i.test(target.pathname);
      const isMainList=target.origin===window.location.origin &&
        (/\/Familytree\/?$/i.test(target.pathname) || /\/index\.html$/i.test(target.pathname));
      if(isPersonPage || isMainList){
        anchor.replaceWith.apply(anchor,Array.from(anchor.childNodes));
      }
    });
  }

  if(button){
    button.addEventListener('click',async function(){
      const shareUrl=new URL(window.location.href);
      shareUrl.searchParams.set('share','1');
      const title=document.title || document.querySelector('h1')?.textContent || 'Биография';
      const shareData={title:title,text:title,url:shareUrl.href};

      if(typeof navigator.share==='function'){
        try{
          await navigator.share(shareData);
          return;
        }catch(error){
          if(error && error.name==='AbortError') return;
        }
      }

      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(shareUrl.href);
          button.textContent='Ссылка скопирована';
          return;
        }
      }catch(error){}

      window.prompt('Скопируйте ссылку на биографию:',shareUrl.href);
    });
  }
})();
</script>
<!-- SHARE_CONTROLS_END --></body></html>
